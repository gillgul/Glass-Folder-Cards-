<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glass Folder Cards</title>
<style>
/* ---- demo page ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #ffffff;
  color: #0a0a0a;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.desk {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 100svh;
  overflow: hidden;
  padding: 64px 24px;
}
.desk-dots {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .13;
  background-image: radial-gradient(currentColor 1.1px, transparent 1.4px);
  background-size: 22px 22px;
}
.desk-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  align-items: end;
  justify-items: center;
  column-gap: 56px;
  row-gap: 40px;
  max-width: 1180px;
}
@media (min-width: 768px) { .desk-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1280px) { .desk-grid { grid-template-columns: repeat(3, 1fr); } }
.desk-hint {
  position: relative;
  margin: 56px 0 0;
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #737373;
}

/* ---- Glass Folder component ------------------------------------------------ */
.gf-root {
  --gf-px: 0;
  --gf-py: 0;
  --gf-ease: cubic-bezier(.2, .8, .2, 1);
  --gf-spring: cubic-bezier(.34, 1.36, .5, 1);
  --gf-hinge: 0deg;
  --gf-lift: 42px;
  --gf-spread: 0px;
  --gf-fan: 0deg;
  --gf-stack: 15px;
  --gf-ink: #141416;
  --gf-ink-soft: rgba(20, 20, 22, .55);
  position: relative;
  display: inline-block;
  flex: none;
  vertical-align: top;
  font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  isolation: isolate;
}
.gf-root[data-tone="dark"] { --gf-ink: #f5f5f7; --gf-ink-soft: rgba(245, 245, 247, .58); }
.gf-root:hover, .gf-root:focus-within { --gf-hinge: -11deg; --gf-lift: -34px; --gf-spread: 8px; --gf-fan: 1.4deg; --gf-stack: 10px; }
.gf-root[data-open] { --gf-hinge: -24deg; --gf-lift: -96px; --gf-spread: 40px; --gf-fan: 5deg; --gf-stack: 30px; }

.gf-stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 340px;
  height: 272px;
  transform-origin: 0 0;
}
.gf-tilt {
  position: absolute;
  inset: 0;
  transform: perspective(1400px) rotateX(calc(var(--gf-py) * -3deg)) rotateY(calc(var(--gf-px) * 4deg));
  transition: transform .9s var(--gf-ease);
}

.gf-shadow {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: -6px;
  height: 60px;
  border-radius: 40px;
  background: rgba(16, 18, 24, .34);
  filter: blur(22px);
  transform: translateX(calc(var(--gf-px) * -8px));
  transition: transform .9s var(--gf-ease), opacity .9s var(--gf-ease);
}
.gf-root[data-tone="dark"] .gf-shadow { background: rgba(0, 0, 0, .62); }

.gf-back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #f3f3f4 0%, #e3e3e6 100%);
}
.gf-root[data-tone="dark"] .gf-back { background: linear-gradient(180deg, #2a2a2e 0%, #121214 100%); }
.gf-art {
  position: absolute;
  left: -12px;
  top: -12px;
  max-width: none;
  object-fit: cover;
  transform: translate(calc(var(--gf-px) * -7px), calc(var(--gf-py) * -6px)) scale(1.02);
  transition: transform 1.1s var(--gf-ease), opacity 1.2s var(--gf-ease), filter 1.2s var(--gf-ease);
}
canvas.gf-art { opacity: 0; filter: blur(14px) saturate(.6); }
canvas.gf-art[data-ready] { opacity: 1; filter: none; }
.gf-back-sheen {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 22%),
    radial-gradient(120% 80% at 80% 0%, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 60%);
  pointer-events: none;
}

.gf-rim {
  position: absolute;
  left: 0;
  top: 0;
  max-width: none;
  overflow: visible;
  pointer-events: none;
  fill: none;
}
.gf-back-rim { width: 340px; height: 272px; }
.gf-back-rim path { stroke: rgba(255, 255, 255, .45); stroke-width: 1; }
.gf-root[data-tone="dark"] .gf-back-rim path { stroke: rgba(255, 255, 255, .16); }

/* ---- files ---------------------------------------------------------------- */
.gf-files {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  /* nothing hangs out of the bottom of the pocket, however tall the stack */
  clip-path: inset(-400px -400px 10px -400px);
}
.gf-sheet-slot { display: contents; }
.gf-sheet {
  all: unset;
  box-sizing: border-box;
  position: absolute;
  left: 34px;
  top: 96px;
  width: 272px;
  height: 184px;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  pointer-events: auto;
  background: linear-gradient(180deg, #ffffff 0%, #f2f2f0 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .9),
    0 0 0 .5px rgba(0, 0, 0, .1),
    0 10px 26px -8px rgba(10, 12, 20, .28);
  transform-origin: 50% 100%;
  transform:
    translate(calc(var(--gf-jx) + var(--gf-slot) * var(--gf-spread)), calc(var(--gf-lift) + var(--gf-depth) * var(--gf-stack) * -1))
    rotate(calc(var(--gf-jr) + var(--gf-slot) * var(--gf-fan)));
  transition:
    transform .75s var(--gf-spring) calc(var(--gf-depth) * 40ms),
    box-shadow .4s var(--gf-ease),
    translate .9s var(--gf-ease),
    opacity .9s var(--gf-ease);
}
.gf-root[data-tone="dark"] .gf-sheet { background: linear-gradient(180deg, #2c2c30 0%, #1c1c1f 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 0 0 .5px rgba(255, 255, 255, .08), 0 12px 28px -8px rgba(0, 0, 0, .7); }
.gf-sheet--art { background: #1a1a1d; }
.gf-root[data-open] .gf-sheet:hover,
.gf-root[data-open] .gf-sheet:focus-visible {
  transform:
    translate(calc(var(--gf-jx) + var(--gf-slot) * var(--gf-spread)), calc(var(--gf-lift) + var(--gf-depth) * var(--gf-stack) * -1 - 18px))
    rotate(calc(var(--gf-slot) * var(--gf-fan) * .6));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 0 0 .5px rgba(0, 0, 0, .1), 0 22px 40px -12px rgba(10, 12, 20, .42);
  transition-delay: 0s;
}
.gf-sheet:focus-visible { outline: 2px solid #4c8dff; outline-offset: 2px; }
.gf-sheet-art {
  position: absolute;
  left: 0;
  top: 0;
  width: 272px;
  height: 184px;
  max-width: none;
  object-fit: cover;
  transition: opacity .9s var(--gf-ease), filter .9s var(--gf-ease);
}
canvas.gf-sheet-art { opacity: 0; filter: blur(10px); }
canvas.gf-sheet-art[data-ready] { opacity: 1; filter: none; }
.gf-sheet--art::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(0, 0, 0, .42) 0%, rgba(0, 0, 0, 0) 34%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  pointer-events: none;
}
.gf-sheet-head {
  position: absolute;
  left: 14px;
  right: 14px;
  top: 11px;
  z-index: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  white-space: nowrap;
}
.gf-sheet-name {
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12.5px;
  font-weight: 560;
  letter-spacing: -.005em;
  color: #18181b;
}
.gf-sheet-meta {
  flex: none;
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: .02em;
  color: rgba(24, 24, 27, .5);
}
.gf-root[data-tone="dark"] .gf-sheet-name, .gf-sheet--art .gf-sheet-name { color: #fafafa; }
.gf-root[data-tone="dark"] .gf-sheet-meta, .gf-sheet--art .gf-sheet-meta { color: rgba(250, 250, 250, .66); }
.gf-lines {
  position: absolute;
  left: 14px;
  right: 14px;
  top: 40px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.gf-lines i {
  display: block;
  height: 5px;
  border-radius: 3px;
  background: rgba(24, 24, 27, .08);
}
.gf-lines i:first-child { height: 9px; margin-bottom: 4px; background: rgba(24, 24, 27, .14); }
.gf-root[data-tone="dark"] .gf-lines i { background: rgba(255, 255, 255, .08); }
.gf-root[data-tone="dark"] .gf-lines i:first-child { background: rgba(255, 255, 255, .16); }

.gf-sheet--drop { animation: gf-drop .85s var(--gf-ease) both; }
@keyframes gf-drop {
  0% { translate: 0 -190px; rotate: -9deg; opacity: 0; }
  35% { opacity: 1; }
  72% { translate: 0 10px; rotate: 1deg; }
  100% { translate: 0 0; rotate: 0deg; opacity: 1; }
}

/* ---- front glass ----------------------------------------------------------- */
.gf-front {
  position: absolute;
  left: 0;
  top: 74px;
  width: 340px;
  height: 198px;
  z-index: 10;
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  backdrop-filter: blur(22px) saturate(1.5);
  transform-origin: 50% 100%;
  transform: perspective(760px) rotateX(var(--gf-hinge));
  transition: transform .8s var(--gf-spring), translate 1s var(--gf-ease), opacity 1s var(--gf-ease);
}
.gf-front--bump { animation: gf-bump .7s var(--gf-ease) .38s both; }
@keyframes gf-bump {
  0% { scale: 1; }
  35% { scale: 1.018 .975; }
  70% { scale: .996 1.006; }
  100% { scale: 1; }
}
.gf-tint {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .5) 42%, rgba(252, 252, 252, .93) 100%);
}
.gf-root[data-tone="dark"] .gf-tint {
  background: linear-gradient(180deg, rgba(18, 18, 20, .18) 0%, rgba(14, 14, 16, .62) 46%, rgba(8, 8, 10, .94) 100%);
}
.gf-spec {
  position: absolute;
  inset: 0;
  background: radial-gradient(260px 200px at calc(50% + var(--gf-px) * 46%) calc(30% + var(--gf-py) * 40%), rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 70%);
  mix-blend-mode: soft-light;
  opacity: .9;
  transition: background-position .6s var(--gf-ease);
  pointer-events: none;
}
.gf-root[data-tone="dark"] .gf-spec { mix-blend-mode: screen; opacity: .16; }
.gf-front-rim { width: 340px; height: 198px; }
.gf-front-rim path { stroke-width: 2.4; transition: stroke-width .3s var(--gf-ease); }
.gf-root[data-tone="dark"] .gf-front-rim { opacity: .55; }

.gf-hit {
  all: unset;
  position: absolute;
  inset: 0;
  z-index: 1;
  cursor: pointer;
}
.gf-hit:focus-visible ~ .gf-label .gf-title { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.gf-front:has(.gf-hit:focus-visible) .gf-front-rim path { stroke-width: 5; }

.gf-label {
  position: absolute;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 200px;
  pointer-events: none;
  color: var(--gf-ink);
}
.gf-root[data-place="bottom-left"] .gf-label { left: 28px; bottom: 32px; }
.gf-root[data-place="top-left"] .gf-label { left: 28px; top: 34px; }
.gf-root[data-place="top-right"] .gf-label { right: 32px; top: 52px; align-items: flex-start; }
.gf-title {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -.012em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gf-meta {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  letter-spacing: .03em;
  color: var(--gf-ink-soft);
  white-space: nowrap;
  animation: gf-roll .5s var(--gf-ease) both;
}
@keyframes gf-roll {
  from { opacity: 0; translate: 0 7px; filter: blur(3px); }
  to { opacity: 1; translate: 0 0; filter: blur(0); }
}

/* ---- the key: + or ··· ------------------------------------------------------ */
.gf-key {
  all: unset;
  box-sizing: border-box;
  position: absolute;
  right: 22px;
  bottom: 22px;
  z-index: 12;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .35s var(--gf-spring), box-shadow .35s var(--gf-ease), background .35s var(--gf-ease);
}
.gf-key:hover { transform: translateY(-2px); }
.gf-key:active { transform: translateY(0) scale(.93); transition-duration: .12s; }
.gf-key:focus-visible { outline: 2px solid #4c8dff; outline-offset: 3px; }
.gf-key--add {
  color: #fff;
  background: radial-gradient(120% 90% at 50% 0%, #3a3a3f 0%, #121214 55%, #050506 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .22),
    inset 0 -3px 8px rgba(0, 0, 0, .7),
    0 0 0 1px rgba(0, 0, 0, .75),
    0 14px 22px -8px rgba(0, 0, 0, .55),
    0 3px 6px -2px rgba(0, 0, 0, .35);
}
.gf-root[data-tone="dark"] .gf-key--add {
  color: #111113;
  background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #ececee 55%, #d2d2d6 100%);
  box-shadow: inset 0 1px 0 #fff, inset 0 -3px 8px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .4), 0 14px 22px -8px rgba(0, 0, 0, .7);
}
.gf-key--more {
  color: #111113;
  background: linear-gradient(180deg, rgba(255, 255, 255, .92) 0%, rgba(226, 226, 230, .82) 100%);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -2px 4px rgba(0, 0, 0, .06),
    0 0 0 1px rgba(0, 0, 0, .16),
    0 10px 18px -8px rgba(0, 0, 0, .3);
}
.gf-root[data-tone="dark"] .gf-key--more {
  color: #f5f5f7;
  background: linear-gradient(180deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .06) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 0 0 1px rgba(255, 255, 255, .1), 0 10px 18px -8px rgba(0, 0, 0, .6);
}
.gf-key--more[aria-expanded="true"] { transform: scale(.96); }
.gf-glyph { display: block; max-width: none; fill: none; stroke: currentColor; stroke-linecap: round; }
.gf-glyph--plus { width: 26px; height: 26px; stroke-width: 1.6; animation: gf-turn .6s var(--gf-spring); }
.gf-glyph--more { width: 30px; height: 12px; stroke-width: 1.7; }
@keyframes gf-turn { from { rotate: -90deg; } to { rotate: 0deg; } }

/* ---- menu ------------------------------------------------------------------- */
.gf-menu {
  position: absolute;
  right: 22px;
  bottom: 90px;
  z-index: 20;
  min-width: 176px;
  padding: 6px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  background: rgba(252, 252, 253, .72);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 0 0 .5px rgba(0, 0, 0, .14), 0 24px 48px -16px rgba(10, 12, 20, .4);
  transform-origin: 100% 100%;
  opacity: 0;
  visibility: hidden;
  transform: translateY(6px) scale(.94);
  transition: opacity .2s var(--gf-ease), transform .32s var(--gf-spring), visibility 0s .32s;
}
.gf-menu[data-open] { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.gf-root[data-tone="dark"] .gf-menu { background: rgba(30, 30, 34, .72); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 0 0 .5px rgba(255, 255, 255, .1), 0 24px 48px -16px rgba(0, 0, 0, .8); }
.gf-menu-item {
  all: unset;
  box-sizing: border-box;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 450;
  color: #18181b;
  cursor: pointer;
}
.gf-root[data-tone="dark"] .gf-menu-item { color: #f4f4f5; }
.gf-menu-item:hover, .gf-menu-item:focus-visible { background: rgba(24, 24, 27, .07); }
.gf-root[data-tone="dark"] .gf-menu-item:hover, .gf-root[data-tone="dark"] .gf-menu-item:focus-visible { background: rgba(255, 255, 255, .09); }
.gf-menu-item--danger { color: #d92d20; }
.gf-root[data-tone="dark"] .gf-menu-item--danger { color: #ff6b5e; }

/* ---- entrance: the folder assembles itself ---------------------------------- */
.gf-root:not([data-entered]) .gf-back,
.gf-root:not([data-entered]) .gf-back-rim { translate: 0 22px; opacity: 0; }
.gf-root:not([data-entered]) .gf-sheet { translate: 0 -120px; opacity: 0; }
.gf-root:not([data-entered]) .gf-front { translate: 0 46px; opacity: 0; }
.gf-root:not([data-entered]) .gf-key { opacity: 0; scale: .6; }
.gf-root:not([data-entered]) .gf-shadow { opacity: 0; }
.gf-back, .gf-back-rim { transition: translate 1s var(--gf-ease), opacity .9s var(--gf-ease); }
.gf-root[data-entered] .gf-sheet { transition-delay: calc(var(--gf-depth) * 40ms), 0s, calc(.18s + var(--gf-depth) * 90ms), calc(.18s + var(--gf-depth) * 90ms); }
.gf-root[data-entered] .gf-front { transition-delay: 0s, .42s, .42s; }
.gf-key { transition: transform .35s var(--gf-spring), box-shadow .35s var(--gf-ease), opacity .6s var(--gf-ease) .7s, scale .7s var(--gf-spring) .7s; }

@media (prefers-reduced-motion: reduce) {
  .gf-root *, .gf-root *::before, .gf-root *::after {
    transition-duration: 0s !important;
    transition-delay: 0s !important;
    animation: none !important;
  }
  .gf-tilt { transform: none; }
}
</style>
</head>
<body>
<main class="desk">
  <div class="desk-dots" aria-hidden="true"></div>
  <div class="desk-grid" id="folders"></div>
  <p class="desk-hint">Hover to lean · Click to open · + to add</p>
</main>

<script>
/**
 * Glass Folder Cards — plain-JavaScript version of the React component in
 * components/ui/glass-folder-cards.tsx. No libraries, no build step.
 *
 * Usage:
 *   const folder = createGlassFolder({ label: "My Files", art: "aurora" })
 *   document.body.append(folder)
 *
 * Options mirror the React props: label, meta, tone ("light" | "dark"),
 * art (preset name, recipe object or "none"), seed, image, files, action
 * ("add" | "more" | "none"), onAdd, onFilesChange, menu, labelPlacement,
 * defaultOpen, onOpenChange, onFileSelect, width, appear, appearDelay, className.
 */
;(function () {
  "use strict"

  // #region art
  const ART_PRESETS = {
    // a long exposure: blush, oxblood and steel pulled across the frame
    aurora: {
      style: "streak",
      colors: ["#f4efe9", "#e9c2b8", "#c2433f", "#2a1e2a", "#22395e", "#6f97c2", "#e5edf4"],
      scale: 0.7, warp: 1.4, angle: -0.62, gloss: 0.18, veins: 0,
    },
    // red ink folding through teal-black water
    ember: {
      style: "marble",
      colors: ["#07090c", "#16252c", "#3d5f68", "#1a1416", "#a3201a", "#ef4a2b", "#ff8a5c"],
      scale: 0.62, warp: 3.2, angle: -0.5, gloss: 0.55, veins: 0.6,
    },
    // plum and rust, swirled
    dusk: {
      style: "marble",
      colors: ["#120c18", "#3e2850", "#8f6c9c", "#2b1a24", "#b3502f", "#eab08a", "#fbe7d2"],
      scale: 0.75, warp: 3.6, angle: 0.8, gloss: 0.5, veins: 0.5,
    },
    // cold, pale, nearly white
    glacier: {
      style: "streak",
      colors: ["#f7f8fa", "#d9e2ea", "#9fb4c7", "#e8edf2", "#bccbd8", "#ffffff"],
      scale: 0.7, warp: 1.6, angle: 0.35, gloss: 0.25, veins: 0,
    },
    // moss and brass
    verdant: {
      style: "marble",
      colors: ["#070b08", "#173024", "#4f7a5a", "#141812", "#a7843a", "#e9cf87", "#fbf3d6"],
      scale: 0.7, warp: 3.4, angle: 2.1, gloss: 0.5, veins: 0.5,
    },
  }

  /** `#rgb` or `#rrggbb` to a triple. Anything unreadable comes back mid-grey. */
  function hexToRgb(hex) {
    let h = hex.trim().replace(/^#/, "")
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]
    const n = /^[0-9a-f]{6}$/i.test(h) ? parseInt(h, 16) : 0x808080
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
  }

  /** A small, fast, seedable PRNG (mulberry32). */
  function rng(seed) {
    let a = seed >>> 0
    return () => {
      a = (a + 0x6d2b79f5) >>> 0
      let t = a
      t = Math.imul(t ^ (t >>> 15), t | 1)
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }

  /** A stable small integer for a string, so a file's art follows its name. */
  function hashString(s) {
    let h = 2166136261
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619)
    return h >>> 0
  }

  /** Seeded gradient noise, summed into fractal octaves with a rotation between each. */
  function makeFbm(seed) {
    const r = rng(seed)
    const perm = new Uint8Array(512)
    const grad = new Float32Array(512)
    const p = []
    for (let i = 0; i < 256; i++) p.push(i)
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1))
      const t = p[i]
      p[i] = p[j]
      p[j] = t
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255]
    for (let i = 0; i < 256; i++) {
      const a = r() * Math.PI * 2
      grad[i * 2] = Math.cos(a)
      grad[i * 2 + 1] = Math.sin(a)
    }
    const noise = (x, y) => {
      const xi = Math.floor(x)
      const yi = Math.floor(y)
      const xf = x - xi
      const yf = y - yi
      const X = xi & 255
      const Y = yi & 255
      const h00 = perm[X + perm[Y]] * 2
      const h10 = perm[X + 1 + perm[Y]] * 2
      const h01 = perm[X + perm[Y + 1]] * 2
      const h11 = perm[X + 1 + perm[Y + 1]] * 2
      const d00 = grad[h00] * xf + grad[h00 + 1] * yf
      const d10 = grad[h10] * (xf - 1) + grad[h10 + 1] * yf
      const d01 = grad[h01] * xf + grad[h01 + 1] * (yf - 1)
      const d11 = grad[h11] * (xf - 1) + grad[h11 + 1] * (yf - 1)
      const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10)
      const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10)
      return d00 + u * (d10 - d00) + v * (d01 - d00 + u * (d11 - d01 - d10 + d00))
    }
    return (x, y, octaves) => {
      let sum = 0
      let amp = 0.5
      for (let i = 0; i < octaves; i++) {
        sum += amp * noise(x, y)
        const nx = 1.6 * x + 1.2 * y + 7.1
        y = -1.2 * x + 1.6 * y + 3.3
        x = nx
        amp *= 0.5
      }
      return sum
    }
  }

  /**
   * The artwork, as a job that can be spread over several frames: a
   * domain-warped noise field shaded as a liquid surface.
   */
  function createArtJob(width, height, recipe, seed) {
    const w = Math.max(1, Math.round(width))
    const h = Math.max(1, Math.round(height))
    const colors = recipe.colors.length >= 2 ? recipe.colors : ["#111111", "#eeeeee"]
    const stops = colors.map((c, i) => ({ t: i / (colors.length - 1), c: hexToRgb(c) }))
    const scale = recipe.scale ?? 0.7
    const warp = recipe.warp ?? 3
    const gloss = recipe.gloss ?? 0.4
    const veins = recipe.veins ?? 0
    const streak = recipe.style === "streak"
    const fbm = makeFbm(seed * 977 + 13)
    const r = rng(seed + 1)
    const ox = r() * 50
    const oy = r() * 50
    const angle = (recipe.angle ?? 0) + (r() - 0.5) * 0.5
    const ca = Math.cos(angle)
    const sa = Math.sin(angle)
    const m = Math.min(w, h)
    // half-resolution grid (with a one-cell apron), brought up with Catmull-Rom
    const gw = Math.ceil(w / 2) + 3
    const gh = Math.ceil(h / 2) + 3
    const G = new Float32Array(gw * gh)
    const GQ = new Float32Array(gw * gh)
    const F = new Float32Array(w * h)
    const Q = new Float32Array(w * h)
    const pixels = new Uint8ClampedArray(w * h * 4)
    let row = 0

    const field = (gy) => {
      for (let gx = 0; gx < gw; gx++) {
        const u = ((gx - 1) * 2 - w / 2) / m
        const v = ((gy - 1) * 2 - h / 2) / m
        let px = (u * ca - v * sa) * scale
        let py = (u * sa + v * ca) * scale
        if (streak) {
          px *= 0.14
          py *= 2.2
        }
        px += ox
        py += oy
        const qx = fbm(px, py, 3)
        const qy = fbm(px + 5.2, py + 1.3, 3)
        const rx = fbm(px + warp * qx + 1.7, py + warp * qy + 9.2, 3)
        const ry = fbm(px + warp * qx + 8.3, py + warp * qy + 2.8, 3)
        G[gy * gw + gx] = fbm(px + warp * rx, py + warp * ry, 4)
        GQ[gy * gw + gx] = Math.sqrt(qx * qx + qy * qy)
      }
    }

    const upsample = () => {
      // pixel x sits on grid column x/2 + 1: either exactly on a sample, or halfway
      const cr = (a, b, c, d) => (-a + 9 * b + 9 * c - d) / 16
      const T = new Float32Array(w * gh)
      for (let gy = 0; gy < gh; gy++) {
        const r = gy * gw
        for (let x = 0; x < w; x++) {
          const c = (x >> 1) + 1
          T[gy * w + x] = x & 1 ? cr(G[r + c - 1], G[r + c], G[r + c + 1], G[r + c + 2]) : G[r + c]
        }
      }
      for (let y = 0; y < h; y++) {
        const c = (y >> 1) + 1
        for (let x = 0; x < w; x++) {
          F[y * w + x] =
            y & 1 ? cr(T[(c - 1) * w + x], T[c * w + x], T[(c + 1) * w + x], T[(c + 2) * w + x]) : T[c * w + x]
          const gx = (x >> 1) + 1
          const q0 = GQ[c * gw + gx]
          const qx = x & 1 ? (q0 + GQ[c * gw + gx + 1]) / 2 : q0
          const q1 = y & 1 ? (x & 1 ? (GQ[(c + 1) * gw + gx] + GQ[(c + 1) * gw + gx + 1]) / 2 : GQ[(c + 1) * gw + gx]) : qx
          Q[y * w + x] = (qx + q1) / 2
        }
      }
    }

    const colorize = () => {
      // percentiles from a sample, not a full sort: cheap and just as stable
      const sample = []
      const stride = Math.max(1, Math.floor(F.length / 4096))
      for (let i = 0; i < F.length; i += stride) sample.push(F[i])
      sample.sort((a, b) => a - b)
      const lo = sample[Math.floor(sample.length * 0.02)]
      const hi = sample[Math.floor(sample.length * 0.98)]
      const k = 1 / (hi - lo || 1)
      const lx = -0.55
      const ly = -0.65
      const lz = 0.52
      const slope = k * m * 0.012
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x
          let t = (F[i] - lo) * k
          t = t < 0 ? 0 : t > 1 ? 1 : t
          let j = 1
          while (j < stops.length - 1 && stops[j].t < t) j++
          const a = stops[j - 1]
          const b = stops[j]
          let f = (t - a.t) / (b.t - a.t || 1)
          f = f < 0 ? 0 : f > 1 ? 1 : f
          f = f * f * (3 - 2 * f)
          const gx = (F[x < w - 1 ? i + 1 : i] - F[x > 0 ? i - 1 : i]) * slope
          const gy = (F[y < h - 1 ? i + w : i] - F[y > 0 ? i - w : i]) * slope
          const nd = (-gx * lx - gy * ly + lz) / Math.sqrt(gx * gx + gy * gy + 1)
          const spec = Math.pow(nd > 0 ? nd : 0, 24) * gloss * 255
          const silk = 1 + 0.035 * Math.sin(t * 150 + Q[i] * 24)
          const vein = veins * Math.max(0, 1 - Math.abs(Q[i] - 0.42) * 14) * 0.6
          const lit = (0.82 + 0.28 * nd) * silk * (1 - vein)
          pixels[i * 4] = (a.c[0] + (b.c[0] - a.c[0]) * f) * lit + spec
          pixels[i * 4 + 1] = (a.c[1] + (b.c[1] - a.c[1]) * f) * lit + spec
          pixels[i * 4 + 2] = (a.c[2] + (b.c[2] - a.c[2]) * f) * lit + spec
          pixels[i * 4 + 3] = 255
        }
      }
    }

    const step = (rows) => {
      if (row >= gh) return true
      const end = Math.min(gh, row + Math.max(1, rows))
      while (row < end) field(row++)
      if (row < gh) return false
      upsample()
      colorize()
      return true
    }

    return { width: w, height: h, pixels, step }
  }

  /** Where a file sits in the fan: -1 … 1 across the visible stack, 0 for one file. */
  function fanSlot(index, count) {
    return count <= 1 ? 0 : (index / (count - 1)) * 2 - 1
  }
  // #endregion

  const recipeOf = (art) => (typeof art === "string" ? ART_PRESETS[art] : art)

  // One shared painter: every folder queues its art here and the queue spends
  // a few milliseconds a frame, so a row of folders never janks.
  const artCache = new Map()
  const queue = []
  let pumping = false

  function pump() {
    if (pumping) return
    pumping = true
    const tick = () => {
      const until = performance.now() + 7
      while (queue.length && performance.now() < until) {
        const head = queue[0]
        if (head.job.step(4)) {
          queue.shift()
          const c = document.createElement("canvas")
          c.width = head.job.width
          c.height = head.job.height
          c.getContext("2d")?.putImageData(new ImageData(head.job.pixels, c.width, c.height), 0, 0)
          head.done(c)
        }
      }
      if (queue.length) requestAnimationFrame(tick)
      else pumping = false
    }
    requestAnimationFrame(tick)
  }

  /** Lower priority paints first: back panels (0) before the files tucked behind glass (1). */
  function paint(recipe, seed, w, h, priority) {
    const key = JSON.stringify([recipe, seed, w, h])
    let p = artCache.get(key)
    if (!p) {
      p = new Promise((done) => {
        // never jump the job already in progress
        let at = queue.length
        while (at > 1 && queue[at - 1].priority > priority) at--
        queue.splice(at, 0, { job: createArtJob(w, h, recipe, seed), priority, done })
        pump()
      })
      artCache.set(key, p)
    }
    return p
  }

  // ---- DOM helpers ----------------------------------------------------------
  const SVG_NS = "http://www.w3.org/2000/svg"

  function el(tag, attrs, children) {
    const node = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue
      if (k === "class") node.className = v
      else if (k === "text") node.textContent = v
      else node.setAttribute(k, v === true ? "" : v)
    }
    for (const c of children || []) if (c) node.append(c)
    return node
  }

  function svg(tag, attrs, children) {
    const node = document.createElementNS(SVG_NS, tag)
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v)
    for (const c of children || []) node.append(c)
    return node
  }

  function artCanvas(art, seed, w, h, density, priority, className) {
    const c = el("canvas", { class: className, "aria-hidden": "true" })
    c.style.width = w + "px"
    c.style.height = h + "px"
    c.style.maxWidth = "none"
    paint(recipeOf(art), seed, Math.round(w * density), Math.round(h * density), priority).then((src) => {
      c.width = src.width
      c.height = src.height
      c.getContext("2d")?.drawImage(src, 0, 0)
      c.setAttribute("data-ready", "")
    })
    return c
  }

  // restart a CSS animation on an element that already has it
  function replay(node, cls) {
    node.classList.remove(cls)
    void node.getBoundingClientRect()
    node.classList.add(cls)
  }

  // ---- geometry, in the folder's own units (340 × 272, scaled to width) -----
  const W = 340
  const H = 272
  const HEADROOM = 54 // room above the back panel for the files to rise into
  const FRONT_TOP = 74
  const FRONT_H = H - FRONT_TOP
  const SHEET_W = 272
  const SHEET_H = 184

  const BACK_PATH =
    "M0 56A22 22 0 0 1 22 34L146 34C170 34 172 0 198 0L318 0A22 22 0 0 1 340 22L340 250A22 22 0 0 1 318 272L22 272A22 22 0 0 1 0 250Z"
  const FRONT_PATH =
    "M0 22A22 22 0 0 1 22 0L118 0C144 0 146 32 172 32L318 32A22 22 0 0 1 340 54L340 " +
    (FRONT_H - 22) + "A22 22 0 0 1 318 " + FRONT_H + "L22 " + FRONT_H + "A22 22 0 0 1 0 " + (FRONT_H - 22) + "Z"

  const MAX_VISIBLE = 4

  const SAMPLE_FILES = [
    { name: "Cover — final", meta: "PNG · 4.8 MB", art: "ember" },
    { name: "Moodboard", meta: "24 images", art: "dusk" },
    { name: "Brief.pdf", meta: "PDF · 1.2 MB" },
  ]

  let uidCounter = 0

  function createGlassFolder(options) {
    const o = Object.assign(
      {
        label: "My Files",
        tone: "light",
        art: "aurora",
        seed: 3,
        files: SAMPLE_FILES,
        action: "add",
        menu: [],
        labelPlacement: "bottom-left",
        defaultOpen: false,
        width: 340,
        appear: true,
        appearDelay: 0,
      },
      options,
    )
    const uid = "gf" + ++uidCounter
    const label = o.label

    let files = o.files.slice()
    // ids survive re-renders so a newly added file is the only one that animates in
    let ids = files.map((_, i) => i)
    let nextId = files.length
    let dropped = null
    let open = !!o.defaultOpen
    let menuOpen = false

    const k = o.width / W
    const density = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1)) * k

    // ---- build ------------------------------------------------------------
    const root = el("div", { class: "gf-root" + (o.className ? " " + o.className : "") })
    root.dataset.tone = o.tone
    root.dataset.place = o.labelPlacement
    root.style.width = o.width + "px"
    root.style.height = (H + HEADROOM) * k + "px"
    if (!o.appear) root.setAttribute("data-entered", "")

    const stage = el("div", { class: "gf-stage" })
    stage.style.transform = "translateY(" + HEADROOM * k + "px) scale(" + k + ")"
    const tilt = el("div", { class: "gf-tilt" })

    // back panel and its artwork
    const back = el("div", { class: "gf-back", "aria-hidden": "true" })
    back.style.clipPath = "path('" + BACK_PATH + "')"
    if (o.image) {
      back.append(el("img", { class: "gf-art", src: o.image, alt: "", width: W + 24, height: H + 24, draggable: "false" }))
    } else if (o.art !== "none") {
      back.append(artCanvas(o.art, o.seed, W + 24, H + 24, density, 0, "gf-art"))
    }
    back.append(el("div", { class: "gf-back-sheen" }))
    const backRim = svg("svg", { class: "gf-rim gf-back-rim", viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" }, [
      svg("path", { d: BACK_PATH }),
    ])

    // the frosted front panel, hinged on its bottom edge
    const front = el("div", { class: "gf-front" })
    front.style.clipPath = "path('" + FRONT_PATH + "')"
    const frontRim = svg("svg", { class: "gf-rim gf-front-rim", viewBox: "0 0 " + W + " " + FRONT_H, "aria-hidden": "true" }, [
      svg("defs", {}, [
        svg("linearGradient", { id: "gf-rim-" + uid, x1: "0", y1: "0", x2: "0", y2: "1" }, [
          svg("stop", { offset: "0", "stop-color": "#fff", "stop-opacity": "0.95" }),
          svg("stop", { offset: "0.35", "stop-color": "#fff", "stop-opacity": "0.35" }),
          svg("stop", { offset: "1", "stop-color": "#fff", "stop-opacity": "0.12" }),
        ]),
      ]),
      svg("path", { d: FRONT_PATH, stroke: "url(#gf-rim-" + uid + ")" }),
    ])
    const hit = el("button", { type: "button", class: "gf-hit" })
    const title = el("span", { class: "gf-title", text: label })
    let metaEl = el("span", { class: "gf-meta" })
    const labelEl = el("div", { class: "gf-label" }, [title, metaEl])
    front.append(
      el("div", { class: "gf-tint", "aria-hidden": "true" }),
      el("div", { class: "gf-spec", "aria-hidden": "true" }),
      frontRim,
      hit,
      labelEl,
    )

    // the contents: after the glass in tab order, beneath it on screen
    const filesWrap = el("div", { class: "gf-files", role: "list", "aria-label": label + " contents" })

    // the key: + or ···
    let key = null
    let plus = null
    if (o.action !== "none") {
      key = el("button", {
        type: "button",
        class: "gf-key gf-key--" + o.action,
        "aria-label": o.action === "add" ? "Add a file to " + label : "More options for " + label,
        "aria-haspopup": o.action === "more" ? "menu" : undefined,
        "aria-controls": o.action === "more" ? "gf-menu-" + uid : undefined,
      })
      if (o.action === "add") {
        plus = svg("svg", { class: "gf-glyph gf-glyph--plus", viewBox: "0 0 24 24", "aria-hidden": "true" }, [
          svg("path", { d: "M12 4.5v15M4.5 12h15" }),
        ])
        key.append(plus)
      } else {
        key.append(
          svg("svg", { class: "gf-glyph gf-glyph--more", viewBox: "0 0 30 12", "aria-hidden": "true" }, [
            svg("rect", { x: "1", y: "1.5", width: "8", height: "9", rx: "3.4" }),
            svg("rect", { x: "11", y: "1.5", width: "8", height: "9", rx: "3.4" }),
            svg("rect", { x: "21", y: "1.5", width: "8", height: "9", rx: "3.4" }),
          ]),
        )
      }
    }

    const menuEl =
      o.action === "more"
        ? el("div", { id: "gf-menu-" + uid, role: "menu", "aria-label": label + " options", class: "gf-menu" })
        : null

    tilt.append(el("div", { class: "gf-shadow", "aria-hidden": "true" }), back, backRim, front, filesWrap)
    if (key) tilt.append(key)
    if (menuEl) tilt.append(menuEl)
    stage.append(tilt)
    root.append(stage)

    // ---- rendering --------------------------------------------------------
    const sheets = new Map() // id -> list-item element holding the sheet

    function makeSheet(file, id) {
      const picture = !!(file.art || file.image)
      const jitter = rng(hashString(file.name) + id)
      const sheet = el(file.href ? "a" : "button", {
        class: "gf-sheet" + (picture ? " gf-sheet--art" : ""),
        href: file.href,
        type: file.href ? undefined : "button",
      })
      sheet.style.setProperty("--gf-jx", ((jitter() - 0.5) * 10).toFixed(2) + "px")
      sheet.style.setProperty("--gf-jr", ((jitter() - 0.5) * 3.2).toFixed(2) + "deg")
      if (picture) {
        sheet.append(
          file.image
            ? el("img", { class: "gf-sheet-art", src: file.image, alt: "", width: SHEET_W, height: SHEET_H, draggable: "false" })
            : artCanvas(file.art, hashString(file.name) % 997, SHEET_W, SHEET_H, Math.min(density, 1.25), 1, "gf-sheet-art"),
        )
      } else {
        const lines = el("span", { class: "gf-lines", "aria-hidden": "true" })
        for (const wdt of ["86%", "92%", "64%", "88%", "42%"]) {
          const line = el("i")
          line.style.width = wdt
          lines.append(line)
        }
        sheet.append(lines)
      }
      sheet.append(
        el("span", { class: "gf-sheet-head" }, [
          el("span", { class: "gf-sheet-name", text: file.name }),
          file.meta ? el("span", { class: "gf-sheet-meta", text: file.meta }) : null,
        ]),
      )
      sheet.addEventListener("click", () => {
        const index = ids.indexOf(id)
        o.onFileSelect?.(files[index], index)
      })
      sheet.addEventListener("animationend", (e) => {
        if (e.target !== sheet || id !== dropped) return
        dropped = null
        sheet.classList.remove("gf-sheet--drop")
      })
      return el("div", { role: "listitem", class: "gf-sheet-slot" }, [sheet])
    }

    function renderFiles() {
      // the newest files sit at the front of the stack, nearest the glass
      const start = Math.max(0, files.length - MAX_VISIBLE)
      const visibleIds = ids.slice(start)
      for (const [id, slot] of sheets) {
        if (!visibleIds.includes(id)) {
          slot.remove()
          sheets.delete(id)
        }
      }
      visibleIds.forEach((id, v) => {
        let slot = sheets.get(id)
        if (!slot) {
          slot = makeSheet(files[start + v], id)
          sheets.set(id, slot)
        }
        const sheet = slot.firstChild
        sheet.style.setProperty("--gf-slot", fanSlot(v, visibleIds.length))
        sheet.style.setProperty("--gf-depth", visibleIds.length - 1 - v)
        sheet.style.zIndex = v + 1
        sheet.classList.toggle("gf-sheet--drop", id === dropped)
        filesWrap.append(slot) // keeps DOM order matching stack order
      })
    }

    function renderMeta() {
      const count = files.length
      const line = o.meta ?? count + (count === 1 ? " item" : " items")
      if (metaEl.textContent !== line) {
        // a fresh node so the count rolls in again
        const next = el("span", { class: "gf-meta", text: line })
        metaEl.replaceWith(next)
        metaEl = next
      }
      hit.setAttribute("aria-label", (open ? "Close " : "Open ") + label + ", " + count + (count === 1 ? " item" : " items"))
    }

    function renderMenu() {
      if (!menuEl) return
      menuEl.toggleAttribute("data-open", menuOpen)
      key.setAttribute("aria-expanded", String(menuOpen))
      const items = [{ label: open ? "Close folder" : "Open folder", onSelect: () => setOpen(!open) }, ...o.menu]
      menuEl.replaceChildren(
        ...items.map((item) => {
          const b = el("button", {
            type: "button",
            role: "menuitem",
            class: "gf-menu-item" + (item.danger ? " gf-menu-item--danger" : ""),
            tabindex: menuOpen ? "-1" : undefined,
            disabled: !menuOpen,
            text: item.label,
          })
          b.addEventListener("click", () => {
            setMenuOpen(false)
            key.focus()
            item.onSelect?.()
          })
          return b
        }),
      )
    }

    function renderOpen() {
      root.toggleAttribute("data-open", open)
      hit.setAttribute("aria-expanded", String(open))
      // closed files are out of the tab order
      filesWrap.inert = !open
      renderMeta()
      renderMenu()
    }

    function setOpen(next) {
      open = next
      renderOpen()
      o.onOpenChange?.(next)
    }

    function setMenuOpen(next) {
      menuOpen = next
      renderMenu()
      // focus the first menu item when the menu opens
      if (next) menuEl.querySelector("[role=menuitem]")?.focus()
    }

    function addFile() {
      const made = o.onAdd?.(files.slice())
      const file = made || { name: "Untitled " + (files.length + 1), meta: "Just now" }
      files = [...files, file]
      const id = nextId++
      ids = [...ids, id]
      dropped = id
      renderFiles()
      renderMeta()
      replay(front, "gf-front--bump")
      if (plus) replay(plus, "gf-glyph--plus")
      o.onFilesChange?.(files.slice())
    }

    // ---- events -----------------------------------------------------------
    hit.addEventListener("click", () => {
      if (menuOpen) setMenuOpen(false)
      setOpen(!open)
    })

    key?.addEventListener("click", () => (o.action === "add" ? addFile() : setMenuOpen(!menuOpen)))

    menuEl?.addEventListener("keydown", (e) => {
      const items = Array.from(menuEl.querySelectorAll("[role=menuitem]"))
      const at = items.indexOf(document.activeElement)
      const go = (i) => {
        e.preventDefault()
        items[(i + items.length) % items.length]?.focus()
      }
      if (e.key === "ArrowDown") go(at + 1)
      else if (e.key === "ArrowUp") go(at - 1)
      else if (e.key === "Home") go(0)
      else if (e.key === "End") go(items.length - 1)
      else if (e.key === "Tab") setMenuOpen(false)
    })

    // Escape and a press outside close whatever is open
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || (!open && !menuOpen)) return
      if (menuOpen) {
        setMenuOpen(false)
        key.focus()
      } else {
        setOpen(false)
        hit.focus()
      }
    })
    document.addEventListener("pointerdown", (e) => {
      const t = e.target
      if (menuOpen && !menuEl.contains(t) && !key.contains(t)) setMenuOpen(false)
      else if (open && !menuOpen && !root.contains(t)) setOpen(false)
    })

    // pointer: light and parallax follow the cursor
    let raf = 0
    let px = 0
    let py = 0
    const write = () => {
      raf = 0
      root.style.setProperty("--gf-px", px.toFixed(3))
      root.style.setProperty("--gf-py", py.toFixed(3))
    }
    root.addEventListener("pointermove", (e) => {
      if (e.pointerType === "touch") return
      const r = root.getBoundingClientRect()
      px = ((e.clientX - r.left) / r.width) * 2 - 1
      py = ((e.clientY - r.top) / r.height) * 2 - 1
      if (!raf) raf = requestAnimationFrame(write)
    })
    root.addEventListener("pointerleave", () => {
      px = 0
      py = 0
      if (!raf) raf = requestAnimationFrame(write)
    })

    // entrance: assemble the first time the folder is on screen
    if (o.appear) {
      const enter = () => root.setAttribute("data-entered", "")
      if (typeof IntersectionObserver === "undefined") enter()
      else {
        const io = new IntersectionObserver(
          (entries) => {
            if (!entries.some((e) => e.isIntersecting)) return
            io.disconnect()
            setTimeout(enter, o.appearDelay)
          },
          { threshold: 0.25 },
        )
        io.observe(root)
      }
    }

    renderFiles()
    renderOpen()
    return root
  }

  window.createGlassFolder = createGlassFolder
  window.GLASS_FOLDER_ART_PRESETS = ART_PRESETS
})()
